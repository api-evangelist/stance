name: Stance
description: >-
  Stance is a direct-to-consumer apparel brand best known for expressive,
  performance-oriented socks, plus underwear and related apparel sold under the
  "Feel good, do good" tagline. The company operates a Shopify-hosted online
  storefront at stance.com with licensed collaborations (MLB, NBA, Disney, and
  others). Stance publishes no developer product API; its only public
  machine-facing surface is the Shopify Customer Account API (OpenID
  Connect / OAuth 2.0) exposed for customer sign-in at account.stance.com. It
  was surfaced in the API Evangelist network as a portfolio company of Bond
  Capital and Shasta Ventures and enriched from live probes of its public
  well-known discovery documents and storefront pages.
